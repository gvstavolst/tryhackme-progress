name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update timestamp no README
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if grep -q 'Atualizado automaticamente' README.md; then
            sed -i "s|<sub>Atualizado automaticamente.*|<sub>Atualizado automaticamente em: $DATE — [ver perfil](https://tryhackme.com/p/gvstavolst)</sub>|" README.md
          else
            echo "<sub>Atualizado automaticamente em: $DATE — [ver perfil](https://tryhackme.com/p/gvstavolst)</sub>" >> README.md
          fi
          echo "Timestamp atualizado: $DATE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add README.md
          git diff --staged --quiet && echo "Nada para commitar" && exit 0
          git commit -m "chore: atualiza timestamp do badge [skip ci]"
          git push origin main
