name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download TryHackMe Badge
        run: |
          mkdir -p assets
          curl -L -o assets/tryhackme-badge.png \
            "https://tryhackme-badges.s3.amazonaws.com/gvstavolst.png"
          echo "Badge baixado com sucesso!"
          ls -la assets/

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme-badge.png
          git diff --staged --quiet || git commit -m "chore: atualiza badge TryHackMe [skip ci]"
          git push
