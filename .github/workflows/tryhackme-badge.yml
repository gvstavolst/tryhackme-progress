name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp no README
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s|<sub>Atualizado automaticamente.*|<sub>Atualizado automaticamente em: $DATE — [ver perfil](https://tryhackme.com/p/gvstavolst)</sub>|" README.md
          echo "Timestamp atualizado: $DATE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: atualiza timestamp do badge [skip ci]"
          git push
