name: Update TryHackMe Badge

on:
  schedule:
    # Atualiza todo dia às 08:00 UTC (05:00 Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rodar manualmente

# Permissão necessária para commitar de volta ao repositório
permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch TryHackMe Badge
        uses: DhanushNehru/tryhackme-badge-action-workflow@v1.0
        with:
          image_path: './assets/tryhackme-badge.png'
          username: ${{ secrets.THM_USERNAME }}
          user_id: ${{ secrets.THM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
