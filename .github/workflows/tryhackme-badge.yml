name: Update TryHackMe Badge

on:
  schedule:
    # Atualiza todo dia às 08:00 UTC (05:00 Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rodar manualmente

# Permissão necessária para commitar de volta ao repositório
permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TryHackMe profile is accessible
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://tryhackme.com/p/gvstavolst)
          echo "TryHackMe profile status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Profile accessible!"
          else
            echo "⚠️ Profile returned status $STATUS — badge may not update."
          fi

      - name: Update README timestamp
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s|<sub>Atualizado.*|<sub>Atualizado automaticamente em: $DATE — [ver perfil](https://tryhackme.com/p/gvstavolst)</sub>|" README.md
          echo "Timestamp atualizado: $DATE"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update badge timestamp [${{ github.run_number }}]"
          file_pattern: README.md
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
